# KV steady budget trial mtp-s0-u087: lane MTP, util 0.87, SX_OPT_KV_STEADY_BUDGET=0. Generated by compose_gen.py; temporary.
name: "sx-kvsteady-mtp-s0-u087"
services:
  engine:
    image: "shixiang/1cat-vllm-v100:heavily-modified-v1-1003-sm70main"
    container_name: "sx-kvsteady-mtp-s0-u087"
    restart: "no"
    ipc: host
    shm_size: "16gb"
    cap_add: [IPC_LOCK]
    ulimits:
      memlock: -1
      stack: 67108864
    ports: ["127.0.0.1:8141:8001"]
    volumes:
      - {type: bind, source: "/mnt/2t/models", target: /models, read_only: true}
      - {type: bind, source: "/opt/shixiang-inference/cache-kvsteady-tp4", target: /cache}
      - {type: bind, source: "/mnt/2t/build/kvdefault/patch/vllm/config/vllm.py", target: "/usr/local/lib/python3.12/dist-packages/vllm/config/vllm.py", read_only: true}
      - {type: bind, source: "/mnt/2t/build/kvdefault/patch/vllm/v1/worker/kv_steady_budget.py", target: "/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/kv_steady_budget.py", read_only: true}
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      VLLM_QWEN4EXP_PLE_HOST_GIB: "12"
      VLLM_ENGINE_READY_TIMEOUT_S: "1800"
      HOME: "/cache/home"
      XDG_CACHE_HOME: "/cache"
      HF_HOME: "/cache/huggingface"
      HUGGINGFACE_HUB_CACHE: "/cache/huggingface/hub"
      TORCH_HOME: "/cache/torch"
      TRITON_CACHE_DIR: "/cache/triton"
      TILELANG_CACHE_DIR: "/cache/tilelang"
      USER: "sx-inference"
      LOGNAME: "sx-inference"
      OMP_NUM_THREADS: "8"
      VLLM_SM70_QWEN38_HYBRID_PLE: "0"
      VLLM_PLE_CPU_OFFLOAD: "0"
      VLLM_PLE_DISK_OFFLOAD: "0"
      VLLM_SM70_NVFP4_MOE_GROUPED_DECODE: "1"
      VLLM_SM70_NVFP4_MOE_TUNE_MAX_TOKENS: "1200"
      SX_OPT_KV_STEADY_BUDGET: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["4", "5", "6", "7"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8001/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3600s
    entrypoint: ["vllm", "serve"]
    command:
      - "/models/Swift-1.5-Qwen3.8-Flash-Next-NVFP4"
      - "--served-model-name=Swift-1.5-Qwen3.8-Flash-Next"
      - "--host=0.0.0.0"
      - "--port=8001"
      - "--tensor-parallel-size=4"
      - "--dtype=half"
      - "--attention-backend=FLASH_ATTN_V100"
      - "--max-model-len=32768"
      - "--max-num-seqs=16"
      - "--max-num-batched-tokens=8192"
      - "--gpu-memory-utilization=0.87"
      - "--kv-cache-dtype=auto"
      - "--trust-remote-code"
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser=qwen3_coder"
      - "--reasoning-parser=qwen3"
      - "--language-model-only"
      - "--speculative-config={\"method\":\"mtp\",\"num_speculative_tokens\":4}"
