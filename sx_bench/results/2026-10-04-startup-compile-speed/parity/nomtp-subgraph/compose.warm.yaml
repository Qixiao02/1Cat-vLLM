# cache_parity arm sx-cp-nomtp-subgraph-warm. Temporary.
name: sx-cp-nomtp-subgraph-warm
services:
  cmp:
    image: shixiang/1cat-vllm-v100:heavily-modified-v1-1004-sm70main
    container_name: sx-cp-nomtp-subgraph-warm
    restart: "no"
    init: true
    ipc: host       # host IPC namespace, so /dev/shm is the host's (no shm_size needed, same as swift-tp4)
    user: "997:983"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    tmpfs: ["/tmp:exec,mode=1777", "/run:mode=0755"]
    ulimits: {memlock: {soft: -1, hard: -1}, stack: 67108864}   # memlock -1: 47.7 GiB of PLE is pinned host memory
    ports: ["127.0.0.1:8141:8001"]
    volumes:
      - {type: bind, source: /mnt/2t/models, target: /models, read_only: true}
      - {type: bind, source: /mnt/2t/build/cache_parity/caches-nomtp-subgraph/cache-on, target: /cache}
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      VLLM_QWEN4EXP_PLE_HOST_GIB: "12"
      VLLM_ENGINE_READY_TIMEOUT_S: "1800"
      HOME: "/cache/home"
      XDG_CACHE_HOME: "/cache"
      HF_HOME: "/cache/huggingface"
      HUGGINGFACE_HUB_CACHE: "/cache/huggingface/hub"
      TORCH_HOME: "/cache/torch"
      TRITON_CACHE_DIR: "/cache/triton"
      TILELANG_CACHE_DIR: "/cache/tilelang"
      USER: "sx-inference"
      LOGNAME: "sx-inference"
      OMP_NUM_THREADS: "8"
      VLLM_SM70_QWEN38_HYBRID_PLE: "0"
      VLLM_PLE_CPU_OFFLOAD: "0"
      VLLM_PLE_DISK_OFFLOAD: "0"
      VLLM_SM70_NVFP4_MOE_GROUPED_DECODE: "1"
      VLLM_SM70_NVFP4_MOE_TUNE_MAX_TOKENS: "320"
      SX_OPT_COMPILE_CACHE: "subgraph"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["4","5","6","7"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8001/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 30m
    stop_grace_period: 2m
    entrypoint: ["vllm", "serve"]
    command:
      - '/models/Swift-1.5-Qwen3.8-Flash-Next-NVFP4'
      - '--served-model-name=Swift-1.5-Qwen3.8-Flash-Next'
      - '--host=0.0.0.0'
      - '--port=8001'
      - '--tensor-parallel-size=4'
      - '--dtype=half'
      - '--attention-backend=FLASH_ATTN_V100'
      - '--max-model-len=131072'
      - '--max-num-seqs=24'
      - '--max-num-batched-tokens=8192'
      - '--gpu-memory-utilization=0.90'
      - '--kv-cache-dtype=auto'
      - '--trust-remote-code'
      - '--enable-prefix-caching'
      - '--enable-chunked-prefill'
      - '--enable-auto-tool-choice'
      - '--tool-call-parser=qwen3_coder'
      - '--reasoning-parser=qwen3'
      - '--language-model-only'
